# Release pipeline v2 — thin orchestrator.
#
# The chipdb is generated ONCE (it is platform-independent), then every
# platform is built and validated by its OWN reusable workflow, in parallel,
# on its own native runner (windows is cross-built from linux; nixpkgs cannot
# cross Linux<->macOS, and Nix does not run on Windows):
#
#   chipdb.yml           ubuntu-22.04   bins + XILINX-PARTS-INVENTORY
#   linux-package.yml    ubuntu-22.04   native   (seeds the bins into the package)
#   darwin-package.yml   macos-14        native   (seeds the bins into the package)
#   windows-package.yml  ubuntu-22.04   cross    (copies the bins into the package; wine)
#
# There is ONE chipdb source: the bins that job generates. Each package
# ships them in share/nextpnr/himbaechel/xilinx/, where the engine
# looks for them, and embeds that job's
# XILINX-PARTS-INVENTORY.json. The release publishes the three tarballs, that
# index, BUILD-INFO.json and SHA256SUMS — no per-die chipdb asset. Each
# platform carries its own gate. The platform workflows are
# workflow_call-only, so this is the ONE entry point: a validated package
# of any branch is a dispatch of this workflow on that branch. It only
# picks the date, wires the chipdb artifacts, and — if EVERYTHING is
# green — publishes.
#
# The release is created at the END, as a dated PRERELEASE (never latest),
# following the FPGAwars ecosystem convention (the release actions in
# .github/actions/, copied from that ecosystem — see their README):
# daily cron, the tag resolved at the very beginning, an existing same-tag
# pre-release is replaced, a same-tag STABLE release fails the run, and only
# the newest N pre-releases are kept. Any red aborts with no release; the
# build artifacts stay downloadable for debugging. Promotion to a real
# (latest) release is a manual, human step (see the release note).
name: build-pre-release

on:
  schedule:
    - cron: "0 0 * * *"      # daily, like the other FPGAwars libraries
  workflow_dispatch:
    # To rebuild an existing tag: mark it pre-release first, never
    # delete it — see README, Rebuilding today's tag.
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC). To rebuild an existing tag: mark it pre-release first, never delete it — see README, Rebuilding today's tag"
        required: false
      regenerate_chipdb:
        description: "Ignore the chipdb cache and generate every part from scratch (tests the generation path)"
        required: false
        default: false
        type: boolean

# THE one place that names the yosys: the YosysHQ/oss-cad-suite-build release
# every job installs and validates against. apio's `oss-cad-suite` package
# repackages one such release, and apio checks at run time that both packages
# name the same tag, so a bump is agreed with its maintainer (README, Bumping
# yosys). Nothing else states it: build-info.sh derives the package's
# "yosys-release-tag" (apio#927) from the installed suite.
env:
  YOSYS_RELEASE_TAG: "2026-09-27"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The date is resolved ONCE here and passed down: a consumer derives the
  # asset date from the release TAG (the naming rule, scripts/asset-check.sh),
  # so tag and every asset name must match.
  prepare:
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    outputs:
      date: ${{ steps.d.outputs.date }}
      yosys_release_tag: ${{ steps.d.outputs.yosys_release_tag }}
    steps:
      # The release actions are local composite actions (.github/actions/,
      # copied from the FPGAwars ecosystem): they are files of this tree,
      # so the job checks it out before the first of them.
      - uses: actions/checkout@v7

      - name: Get release and package tags (ecosystem convention)
        uses: ./.github/actions/get-release-and-package-tags
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$RELEASE_TAG"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"
          # env is not visible to the `with:` of a reusable-workflow call:
          # the literal travels down as this job's output
          echo "yosys_release_tag=$YOSYS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "yosys release: $YOSYS_RELEASE_TAG"
      # NOTE: scheduled runs build UNCONDITIONALLY, even with no new commits
      # (ecosystem convention, zapta 2026-08-09: a daily build also catches
      # breakage coming from the github action tools themselves; it is what
      # every other apio package does).  The former no-change guard lived
      # here; cleanup-old-prereleases (keep-5) absorbs the extra releases.

      # Fail FAST if today's tag already exists as a stable release — before
      # spending 3 platform builds on a run that must not publish.
      # just-check does not delete; a same-tag pre-release is replaced later,
      # in the pre-release job, after every platform is green (~50 s window).
      # To rebuild a stable tag: mark it pre-release first, never delete it
      # — see README, Rebuilding today's tag. The existence messages come
      # from the ensure-no-conflicting-release action.
      - name: Ensure no conflicting release (early, just-check)
        uses: ./.github/actions/ensure-no-conflicting-release
        env:
          GH_TOKEN: ${{ github.token }}   # the action drives `gh`, which requires it in Actions
        with:
          release-tag: ${{ steps.d.outputs.date }}
          just-check: "true"

  # The chipdb is generated ONCE (platform-independent bins, revision-keyed
  # cache). The same job writes the XILINX-PARTS-INVENTORY document every
  # package embeds. The bins travel inside the packages.
  chipdb:
    needs: prepare
    uses: ./.github/workflows/chipdb.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      regenerate: ${{ github.event.inputs.regenerate_chipdb == 'true' }}

  linux:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/linux-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: ${{ needs.prepare.outputs.yosys_release_tag }}
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      parts_index: ${{ needs.chipdb.outputs.parts_index }}

  darwin:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/darwin-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: ${{ needs.prepare.outputs.yosys_release_tag }}
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      parts_index: ${{ needs.chipdb.outputs.parts_index }}

  windows:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/windows-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: ${{ needs.prepare.outputs.yosys_release_tag }}
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      parts_index: ${{ needs.chipdb.outputs.parts_index }}

  pre-release:
    needs: [prepare, chipdb, linux, darwin, windows]
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    steps:
      - uses: actions/checkout@v7    # scripts/asset-check.sh

      - uses: actions/download-artifact@v8
        with:
          pattern: openxc7-toolchain-*     # the 3 package artifacts (not chipdb-bins)
          merge-multiple: true

      # The same document each package embedded. Published as its own
      # asset, and checked below against the bins inside every tarball.
      - uses: actions/download-artifact@v8
        with:
          name: parts-index
          path: .

      # Ecosystem convention (the FPGAwars release actions): keep only the
      # newest pre-releases, then replace today's pre-release if it exists —
      # and FAIL if the tag was already promoted to a stable release (never
      # clobber it). The count is a constant of the action (KEEP: 5): it
      # declares no input for it. It counts the dated line only: the
      # upstream nightly's upstream-* pre-releases keep their own five.
      - name: Cleanup old pre-releases (keep the newest 5 dated ones)
        uses: ./.github/actions/cleanup-old-prereleases
        with:
          tag-prefix: ""

      # This delete is the start of the ~50 s publish window; do not delete
      # the release by hand before dispatching — see README, Rebuilding
      # today's tag.
      - name: Ensure no conflicting release (delete same-tag pre-release, fail on stable)
        uses: ./.github/actions/ensure-no-conflicting-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ needs.prepare.outputs.date }}

      # Every tarball dated with the tag and carrying the index and its
      # bins; then the release-level BUILD-INFO.json (the agreement check
      # of the three packages), SHA256SUMS and the release text. The same
      # script composes the upstream nightly's release.
      - name: Check the assets and compose the release body
        run: bash scripts/compose-release.sh "${{ needs.prepare.outputs.date }}"

      # The same action the FPGAwars packages use (a local copy).
      - name: Create the dated prerelease (never latest) and upload assets
        uses: ./.github/actions/create-pre-release
        with:
          release_tag: ${{ needs.prepare.outputs.date }}
          body_path: RELEASE-BODY.md
          files: |
            openxc7-toolchain-*.tgz
            SHA256SUMS
            BUILD-INFO.json
            XILINX-PARTS-INVENTORY.json

      # Close the loop: re-resolve every asset by the tag->date->name rule
      # against what GitHub actually serves, and require the published
      # SHA256SUMS to match the tarballs validated above (the 2026-07-24
      # class of failure -- a tag a consumer resolves to nothing -- dies here).
      - name: Verify the published assets the way a consumer will fetch them
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_CHECK_REPO: ${{ github.repository }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          # The release-asset CDN is eventually consistent: seconds after
          # upload a HEAD can still 404 (the first full run failed here while
          # the very same check passed minutes later). Retry before failing.
          for attempt in 1 2 3 4; do
            bash scripts/asset-check.sh "$DATE" --expect-dir . && exit 0
            echo "asset-check attempt $attempt: assets may still be propagating; retrying"
            sleep 45
          done
          exit 1

      # Promotion stays a human decision; these are the steps it involves.
      - name: Promotion checklist
        env:
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          {
            echo "## Release candidate \`$DATE\` published (prerelease, not latest)"
            echo
            echo "1. Try it for real (manual install from the release text, board test if it applies)."
            echo "2. (optional) Uncheck \`pre-release\` to keep it beyond the cleanup window while testing."
            echo "3. To PUBLISH: run the \`make-pre-release-stable\` workflow with tag \`$DATE\` (verifies, marks stable; \`latest\` input to make it the repository's latest release)."
          } >> "$GITHUB_STEP_SUMMARY"
