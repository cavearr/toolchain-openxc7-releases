# Generate the chipdb and write XILINX-PARTS-INVENTORY.json.
#
# One chipdb file per die, chipdb-<die>.bin: the himbaechel xilinx uarch
# reads the same file for every part (package, speed grade) of a die. Each
# one is a deterministic serialization of prjxray-db (the engine's own
# generator, xilinx_gen.py, then bbasm): platform-independent by
# construction (a die generated on darwin came out byte-identical to the
# linux one).
# Generating them is the slow, memory-heavy step of the whole build (the
# generator of xc7z100 alone peaks at 12.4 GB, more than a hosted macOS
# runner has), so it happens ONCE here, on a linux runner. The platform
# jobs seed their packages from `chipdb-bins`: each tarball ships those
# files in share/nextpnr/himbaechel/xilinx/, where the engine
# opens them. There is no per-die release asset.
# `parts-index` (~50 kB) is the document each package embeds and the
# release publishes under the same name.
#
# Every run generates every die of chipdb-parts.json from the revisions it
# builds: there is no cache, so the generator that made the published bins
# ran in the same run. The .bin travel with their identity stamp
# (chipdb-id.txt): a seed from another toolchain revision is rejected
# instead of silently reused.
name: chipdb

on:
  workflow_call:
    inputs:
      date:
        description: "Asset date YYYY-MM-DD (the release tag the assets are named after)"
        required: true
        type: string
      ref:
        description: "Commit to build (default: the commit the run was started on). The upstream nightly passes the commit that records the upstream revisions in nix/revisions.json"
        required: false
        default: ""
        type: string
    outputs:
      identity:
        description: "chipdb identity stamp (chipdb-id.txt) of the produced bins"
        value: ${{ jobs.chipdb.outputs.identity }}
      parts_index:
        description: "Filename of the XILINX-PARTS-INVENTORY document in the parts-index artifact"
        value: ${{ jobs.chipdb.outputs.parts_index }}

jobs:
  chipdb:
    name: chipdb (generate once, one source for the release)
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    outputs:
      identity: ${{ steps.stamp.outputs.identity }}
      parts_index: ${{ steps.index.outputs.index }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Resolve the asset date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dateid=${DATE//-/}" >> "$GITHUB_OUTPUT"
          echo "Asset date: $DATE"

      # Three dies at a time under the packer's default memory budget
      # (OPENXC7_CHIPDB_MEM_GB, 14 GB for this 16 GB runner): a die starts
      # only when its measured peak fits next to the ones running, so
      # xc7z100 and xc7z045 never run together. Measured on the build
      # server: 9 min for the 10 dies with 10 jobs, ~14 min one at a time.
      - name: Generate the chipdb
        env:
          OPENXC7_CHIPDB_JOBS: 3
        run: |
          rm -rf dist   # stale-dist guard (see pack/chipdb.py)
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py --chipdb-only'

      # The file list comes from the manifest through the packer's own rule
      # (pack.families.chipdb_dies): one chipdb-<die>.bin per die, and
      # nothing else next to them.
      - name: Assert every manifest die is present
        run: |
          python3 -c 'from pack.families import chipdb_dies; from pack.chipdb import chipdb_file; print("\n".join(chipdb_file(die) for _, die in chipdb_dies()))' > chipdb-files.txt
          test -s chipdb-files.txt
          while read -r f; do
            test -f "dist/share/nextpnr/himbaechel/xilinx/$f" || { echo "::error::chipdb missing: $f"; exit 1; }
          done < chipdb-files.txt
          for f in dist/share/nextpnr/himbaechel/xilinx/*.bin; do
            grep -Fxq "$(basename "$f")" chipdb-files.txt \
              || { echo "::error::unexpected chipdb file: $f"; exit 1; }
          done
          echo "chipdb complete: $(wc -l < chipdb-files.txt) dies"

      - name: Export the identity stamp
        id: stamp
        run: |
          ID=$(cat dist/share/nextpnr/himbaechel/xilinx/chipdb-id.txt)
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "chipdb identity: $ID"
          {
            echo "### chipdb"
            echo "identity: \`$ID\` · $(ls dist/share/nextpnr/himbaechel/xilinx/*.bin | wc -l) files, one per die, generated in this run"
            echo ""
            python3 - dist/share/nextpnr/himbaechel/xilinx <<'PYEOF'
          import hashlib, sys
          from pathlib import Path
          from pack.chipdb import chipdb_file
          from pack.families import chipdb_parts, die_of
          users = {}
          for _, part in chipdb_parts():
              users.setdefault(die_of(part), []).append(part)
          print("| file | die | manifest parts | bytes | sha256 |")
          print("|---|---|---|---:|---|")
          for die, parts in users.items():
              path = Path(sys.argv[1]) / chipdb_file(die)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"| {path.name} | {die} | {', '.join(parts)} "
                    f"| {path.stat().st_size} | {digest[:16]}… |")
          PYEOF
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the XILINX-PARTS-INVENTORY document
        id: index
        run: |
          rm -rf parts-index
          START=$SECONDS
          bash scripts/chipdb-assets.sh \
            dist/share/nextpnr/himbaechel/xilinx parts-index "${{ steps.d.outputs.dateid }}" \
            dist/share/nextpnr/external/prjxray-db
          echo "index written in $((SECONDS - START))s"
          # The published index carries the same name as the file inside
          # every package (pack.parts_index.PACKAGE_FILE): the release it
          # belongs to is written inside it, so its name does not repeat
          # the date (XILINX-PARTS-INDEX.json and PARTS-INDEX.json before).
          # No per-die asset is published next to it.
          INDEX=$(python3 -c 'from pack.parts_index import PACKAGE_FILE; print(PACKAGE_FILE)')
          test -f "parts-index/$INDEX"
          # The writer produces the document and nothing else.
          COUNT=$(find parts-index -type f | wc -l)
          [ "$COUNT" -eq 1 ]
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          python3 - "parts-index/$INDEX" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys
          from pack.parts_index import PACKAGE_FILE, chipdb_name
          data = json.load(open(sys.argv[1]))
          print(f"### parts inventory ({PACKAGE_FILE})")
          print(f"schema: **{data['schema']}** · release-tag: "
                f"`{data['release-tag']}` · date: `{data['date']}`")
          print(f"built: **{data['generated-count']}** of {data['part-count']} parts "
                f"the packaged database supports ({data['base-part-count']} base "
                f"parts)")
          print()
          print("| family | parts | built |")
          print("|---|---:|---:|")
          counts = {}
          for entry in data["parts"].values():
              tally = counts.setdefault(entry["family"], [0, 0])
              tally[0] += 1
              tally[1] += 1 if entry["generated"] else 0
          for family, (parts, built) in counts.items():
              print(f"| {family} | {parts} | {built} |")
          print()
          files = {}
          for entry in data["parts"].values():
              if entry["generated"]:
                  name = chipdb_name(entry["base-part"])
                  files[name] = files.get(name, 0) + 1
          print("| chipdb file | parts |")
          print("|---|---:|")
          for name, parts in sorted(files.items()):
              print(f"| {name} | {parts} |")
          PYEOF

      # Consumed by the linux, darwin and windows package jobs of this run:
      # one generation, one set of bins. Each package seeds from these bytes
      # and ships them in the engine's chipdb directory.
      - name: Publish the chipdb bins for the platform jobs
        uses: actions/upload-artifact@v7
        with:
          name: chipdb-bins
          path: |
            dist/share/nextpnr/himbaechel/xilinx/*.bin
            dist/share/nextpnr/himbaechel/xilinx/chipdb-id.txt
          compression-level: 1     # already dense binary data
          retention-days: 7
          if-no-files-found: error

      # The index (~50 kB), for the three package jobs and for the release:
      # each package embeds it under the same name, and the pre-release
      # job publishes the same bytes. No chipdb asset beside it.
      - name: Publish the XILINX-PARTS-INVENTORY document for the platform jobs
        uses: actions/upload-artifact@v7
        with:
          name: parts-index
          path: parts-index/${{ steps.index.outputs.index }}
          retention-days: 7
          if-no-files-found: error
